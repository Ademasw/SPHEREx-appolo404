    <!--
      FONT LOADING
      ------------
      Web fonts are loaded here (not via CSS @import) so they don't block the
      CSS bundle. If you change fonts:
        1. Replace the Google Fonts URL below with your new families.
        2. Update the --font-* variables in src/styles/typography.css.
      That's it — every component reads fonts from those variables.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
